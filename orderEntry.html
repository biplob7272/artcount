<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Entry Form</title>

<link rel="icon" type="image/png" href="http://orderentry.xtgem.com/favicon/favicon.png"> 
<link href="https://banglawebfonts.pages.dev/css/solaiman-lipi.css" rel="stylesheet">

<style>

/* ALL YOUR CSS SAME (NO CHANGE) */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"Times New Roman", Times, 'Solaiman Lipi';
  font-size:20px;
  padding:10px;
  background:#f4f6f8;
}

.toggle-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

/* Switch */
.switch{
  position:relative;
  display:inline-block;
  width:50px;
  height:28px;
}

.switch input{
  opacity:0;
  width:0;
  height:0;
}

.slider{
  position:absolute;
  cursor:pointer;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background-color:#ccc;
  border-radius:34px;
  transition:.3s;
}

.slider:before{
  position:absolute;
  content:"";
  height:22px;
  width:22px;
  left:3px;
  bottom:3px;
  background:white;
  border-radius:50%;
  transition:.3s;
}

input:checked + .slider{
  background-color:#1abc9c;
}

input:checked + .slider:before{
  transform:translateX(22px);
}

/* Dark mode */

body.dark{
  background:#121212;
  color:#fff;
}

body.dark .container{
  background:#1c1f26;
}

body.dark input,
body.dark textarea{
  background:#2a2f38;
  color:#fff;
  border:1px solid #444;
}

body.dark .add-btn{
  background:#2a2f38;
  color:#fff;
  border:1px solid #444;
}

.container{
  background:white;
  padding:20px;
  margin:20px auto;
  max-width:450px;
  border-radius:10px;
}

h3{
  text-align:center;
  margin-bottom:15px;
  font-family:"Times New Roman", Times, 'Solaiman Lipi';
  font-size:25px;
}

input,
textarea{
  width:100%;
  padding:10px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:6px;
  font-family:"Times New Roman", Times, 'Solaiman Lipi';
  font-size:25px;
  transition:0.25s ease;
}

/* Eye friendly mobile validation */

.valid-mobile{
  border:1.5px solid #6fbe95 !important;
  box-shadow:0 0 0 2px rgba(111,190,149,0.14);
}

body.dark .valid-mobile{
  border:1.5px solid #79cfa2 !important;
  box-shadow:0 0 0 2px rgba(121,207,162,0.18);
}

.row{
  display:flex;
  gap:10px;
}

.row > div{
  flex:1;
}

button{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.generate-btn{
  background:#007bff;
  color:white;
  font-family:"Times New Roman", Times, 'Solaiman Lipi';
  font-size:25px;
}

.copy-btn{
  background:#28a745;
  color:white;
  font-family:"Times New Roman", Times, 'Solaiman Lipi';
  font-size:25px;
}

.checkbox-row{
  display:flex;
  gap:10px;
  align-items:center;
}

.checkbox-row label{
  display:flex;
  align-items:center;
  gap:5px;
}

.contact-input{
  display:none;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.contact-input span{
  width:110px;
  min-width:110px;
}

.contact-input input{
  flex:1;
  margin:0;
}

#output{
  white-space:pre-wrap;
  font-family:"Times New Roman", Times, 'Solaiman Lipi';
  font-size:25px;
}

.mobile-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.add-btn{
  width:25px;
  min-width:25px;
  height:25px;
  padding:0;
  margin:0;
  background:#d9d9d9;
  color:#000;
  font-size:24px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:1;
}

#mobile2Wrap{
  display:none;
}

.product-row{
  display:flex;
  gap:10px;
  align-items:end;
}

.product-box{
  flex:3;
}

.long-box{
  flex:1;
}

.product-row input{
  margin-bottom:0;
}

</style>
</head>

<body>

<!-- 🔥 FIX ADDED HERE (NO WHITE FLASH) -->
<script>
if(localStorage.getItem("theme") === "dark"){
  document.body.classList.add("dark");
}
</script>

<div class="container">

<h3 style="display:flex; justify-content:space-between; align-items:center;">

<span>Order Entry Form</span>

<div class="toggle-row">
<label class="switch">
<input type="checkbox" id="themeToggle" onchange="toggleTheme()">
<span class="slider"></span>
</label>
</div>

</h3>

নামঃ
<input type="text" id="name">

<div class="mobile-header">
<span>মোবাইল নাম্বারঃ</span>

<button type="button" class="add-btn" id="mobileToggleBtn" onclick="toggleSecondMobile()">+</button>
</div>

<input type="text" id="mobile1" oninput="checkMobile(this)">

<div id="mobile2Wrap">
<input type="text" id="mobile2" oninput="checkMobile(this)">
</div>

<div class="row">

<div>
জেলাঃ
<input type="text" id="district">
</div>

<div>
থানাঃ
<input type="text" id="thana">
</div>

</div>

রিসিভ পয়েন্টঃ
<textarea id="point" rows="5"></textarea>

<div class="product-row">

<div class="product-box">
পণ্যের নামঃ
<input type="text" id="product">
</div>

<div class="long-box">
সাইজঃ
<input type="text" id="length">
</div>

</div>

পণ্যের বিবরণঃ
<textarea id="description" rows="5"></textarea>

<div class="row">

<div>
সেল প্রাইজঃ
<input type="text" id="sell" oninput="updateTotal(); updateCommission();">
</div>

<div>
ডেলিভারী চার্জঃ
<input type="text" id="delivery" oninput="updateTotal();">
</div>

</div>

<div class="row">

<div>
এডমিন প্রাইজঃ
<input type="text" id="admin" oninput="updateCommission();">
</div>

<div>
কমিশনঃ
<input type="text" id="commission" readonly>
</div>

</div>

মোট দামঃ
<input type="text" id="total" readonly>

Note:
<textarea id="note" rows="6"></textarea>

<div>Select contact platform:</div>

<div class="checkbox-row">

<label>
<input type="checkbox" onchange="toggleBox('fbBox')">
Facebook
</label>

<label>
<input type="checkbox" onchange="toggleBox('waBox')">
WhatsApp
</label>

<label>
<input type="checkbox" onchange="toggleBox('imoBox')">
IMO
</label>

</div>

<div id="fbBox" class="contact-input">
<span>Facebook:</span>
<input type="text" id="fbNumber">
</div>

<div id="waBox" class="contact-input">
<span>W'App:</span>
<input type="text" id="waNumber">
</div>

<div id="imoBox" class="contact-input">
<span>IMO:</span>
<input type="text" id="imoNumber">
</div>

<button class="generate-btn" onclick="generate()">Generate</button>

<textarea id="output" rows="15"></textarea>

<button class="copy-btn" onclick="copyText()">Copy</button>

</div>

<script>

/* ALL JS SAME (NO CHANGE) */

function toggleTheme(){
  let isChecked = document.getElementById("themeToggle").checked;

  if(isChecked){
    document.body.classList.add("dark");
    localStorage.setItem("theme","dark");
  }
  else{
    document.body.classList.remove("dark");
    localStorage.setItem("theme","light");
  }
}

window.onload = function(){
  let saved = localStorage.getItem("theme");

  if(saved === "dark"){
    document.body.classList.add("dark");
    document.getElementById("themeToggle").checked = true;
  }
}

function toggleSecondMobile(){

  let box = document.getElementById("mobile2Wrap");
  let btn = document.getElementById("mobileToggleBtn");

  if(box.style.display === "block"){
    box.style.display = "none";
    btn.innerText = "+";
  }
  else{
    box.style.display = "block";
    btn.innerText = "-";
  }
}

function checkMobile(input){

  let number = input.value.replace(/\D/g,'');

  if(number.length === 11){
    input.classList.add("valid-mobile");
  }
  else{
    input.classList.remove("valid-mobile");
  }
}

function toggleBox(id){

  let el = document.getElementById(id);

  el.style.display = (el.style.display === "flex") ? "none" : "flex";
}

function copyText(){

  let text = output.value;

  if(!text) return;

  let t = document.createElement("textarea");

  t.value = text;

  document.body.appendChild(t);

  t.select();

  document.execCommand("copy");

  t.remove();

  let msg = document.createElement("div");

  msg.innerText = "Copied";

  msg.style = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 15px;border-radius:6px;";

  document.body.appendChild(msg);

  setTimeout(()=>msg.remove(),1500);
}

function updateCommission(){

  let sell = +document.getElementById('sell').value || 0;
  let admin = +document.getElementById('admin').value || 0;

  document.getElementById('commission').value = Math.max(0, sell - admin);
}

function updateTotal(){

  let sell = +document.getElementById('sell').value || 0;
  let delivery = +document.getElementById('delivery').value || 0;

  document.getElementById('total').value = sell + delivery;
}

function generate(){

  let contactLines = [];

  if(document.getElementById('fbBox').style.display === "flex" && fbNumber.value){
    contactLines.push(`Facebook: ${fbNumber.value}`);
  }

  if(document.getElementById('waBox').style.display === "flex" && waNumber.value){
    contactLines.push(`WhatsApp: ${waNumber.value}`);
  }

  if(document.getElementById('imoBox').style.display === "flex" && imoNumber.value){
    contactLines.push(`IMO: ${imoNumber.value}`);
  }

  let mobileText = `মোবাইল নাম্বারঃ ${mobile1.value}`;

  if(
    document.getElementById("mobile2Wrap").style.display === "block"
    &&
    mobile2.value
  ){
    mobileText += `\nমোবাইল নাম্বারঃ ${mobile2.value}`;
  }

  let text =
`নামঃ ${document.getElementById('name').value}
${mobileText}
জেলাঃ ${district.value}
থানাঃ ${thana.value}
রিসিভ পয়েন্টঃ ${point.value}

পণ্য: ${product.value}
লং সাইজ: ${document.getElementById('length').value}

পণ্যের বিবরণ:
${description.value}

এডমিন দাম: ${admin.value}
কমিশন: ${commission.value}
কন্ডিশন: ${sell.value} + ${delivery.value} = ${total.value}/-

Note:
${note.value}

Customer contact--
${contactLines.join('\n')}`;

  output.value = text;
}

</script>

</body>
</html>
